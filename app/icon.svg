<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Official Pulse mark: 3×3 checkerboard (#3ad353 / #0d8137) -->
  <rect width="32" height="32" fill="#0d1117"/>
  <rect x="2" y="2" width="8" height="8" fill="#3ad353"/>
  <rect x="12" y="2" width="8" height="8" fill="#0d8137"/>
  <rect x="22" y="2" width="8" height="8" fill="#3ad353"/>
  <rect x="2" y="12" width="8" height="8" fill="#0d8137"/>
  <rect x="12" y="12" width="8" height="8" fill="#3ad353"/>
  <rect x="22" y="12" width="8" height="8" fill="#0d8137"/>
  <rect x="2" y="22" width="8" height="8" fill="#3ad353"/>
  <rect x="12" y="22" width="8" height="8" fill="#0d8137"/>
  <rect x="22" y="22" width="8" height="8" fill="#3ad353"/>
</svg>
